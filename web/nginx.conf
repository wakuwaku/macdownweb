server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;

  # add_header in a location replaces the server-level ones, so the shared
  # headers live in a snippet that each location includes.
  # Hashed build output never changes: cache it for a year.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything else (index.html, bundled MacDown assets) is revalidated.
  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
